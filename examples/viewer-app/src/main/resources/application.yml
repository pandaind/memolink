memolink:
  # Path to the directory that contains your Markdown (.md) files.
  # The starter scans this directory recursively on startup.
  # Defaults to ~/vault when not set.
  vault-dir: ${MEMOLINK_VAULT_DIR:${user.home}/vault}
  lucene:
    storage: ${MEMOLINK_LUCENE_STORAGE:memory}

server:
  port: 8080

spring:
  application:
    name: memolink-viewer-app
