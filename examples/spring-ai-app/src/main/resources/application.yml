memolink:
  # Path to the directory that contains your Markdown (.md) files.
  # The starter scans this directory recursively on startup.
  notes-dir: examples/sample-notes   # relative paths resolve from the working directory

server:
  port: 8081

spring:
  application:
    name: memolink-spring-ai-app
  ai:
    openai:
      # Set your key via the OPENAI_API_KEY environment variable.
      # Never commit real keys to version control.
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.3
