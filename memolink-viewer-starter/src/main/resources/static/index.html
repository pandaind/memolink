<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>mdgraph — Knowledge Graph</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.2/cytoscape.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── Left sidebar ── */
    #sidebar {
      width: 260px;
      background: #16213e;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #0f3460;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 14px 12px 10px;
      border-bottom: 1px solid #0f3460;
    }
    #sidebar-header h1 {
      font-size: 15px;
      font-weight: 700;
      color: #a855f7;
      letter-spacing: 0.3px;
    }
    #stats-label {
      font-size: 11px;
      color: #666;
      margin-top: 3px;
    }
    #search-wrap {
      padding: 10px 12px;
      border-bottom: 1px solid #0f3460;
    }
    #search-input {
      width: 100%;
      padding: 7px 10px;
      background: #0f3460;
      border: 1px solid #1e4080;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    #search-input:focus { border-color: #a855f7; }
    #note-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
    }
    .note-item {
      padding: 7px 9px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background 0.15s;
      color: #ccc;
    }
    .note-item:hover  { background: #0f3460; color: #fff; }
    .note-item.active { background: #4c2d8a; color: #fff; }

    /* ── Graph canvas ── */
    #graph-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    #cy {
      width: 100%;
      height: 100%;
    }
    #controls {
      position: absolute;
      bottom: 14px;
      right: 14px;
      display: flex;
      gap: 6px;
    }
    .ctrl-btn {
      padding: 6px 12px;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 5px;
      color: #ccc;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: #0f3460; color: #fff; }

    /* ── Right detail panel ── */
    #detail {
      width: 300px;
      background: #16213e;
      border-left: 1px solid #0f3460;
      display: none;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }
    #detail.open { display: flex; }
    #detail-header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid #0f3460;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    #detail-title {
      font-size: 15px;
      font-weight: 600;
      color: #a855f7;
      flex: 1;
      margin-right: 8px;
      word-break: break-word;
    }
    #detail-close {
      cursor: pointer;
      color: #666;
      font-size: 17px;
      line-height: 1;
      flex-shrink: 0;
    }
    #detail-close:hover { color: #ccc; }
    #detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
    }
    .section { margin-bottom: 16px; }
    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #666;
      margin-bottom: 7px;
    }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      background: #0f3460;
      border-radius: 10px;
      font-size: 12px;
      color: #a855f7;
      margin: 2px 2px 2px 0;
    }
    .link-row {
      display: block;
      padding: 4px 0;
      font-size: 13px;
      color: #7c9cff;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .link-row:hover { color: #a855f7; }
    .heading-row {
      font-size: 13px;
      padding: 3px 0;
      color: #bbb;
      border-left: 2px solid #0f3460;
      padding-left: 8px;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <h1>mdgraph</h1>
    <div id="stats-label">Loading…</div>
  </div>
  <div id="search-wrap">
    <input id="search-input" type="search" placeholder="Search notes…" autocomplete="off"/>
  </div>
  <div id="note-list"></div>
</div>

<!-- Graph canvas -->
<div id="graph-wrap">
  <div id="cy"></div>
  <div id="controls">
    <button class="ctrl-btn" onclick="cy.fit()">Fit</button>
    <button class="ctrl-btn" onclick="resetHighlight(); cy.reset()">Reset</button>
    <button class="ctrl-btn" onclick="nextLayout()">Relayout</button>
  </div>
</div>

<!-- Detail panel -->
<div id="detail">
  <div id="detail-header">
    <span id="detail-title"></span>
    <span id="detail-close" onclick="closeDetail()">✕</span>
  </div>
  <div id="detail-body"></div>
</div>

<script>
  let cy, graphData;
  let activeNoteId = null;
  let layouts = ['cose', 'circle', 'grid', 'concentric'];
  let layoutIdx = 0;

  // ── Bootstrap ───────────────────────────────────────────────────────────────
  function loadGraph() {
    const statsLabel = document.getElementById('stats-label');
    statsLabel.textContent = 'Loading…';
    fetch('/api/graph')
      .then(r => r.json())
      .then(data => {
        graphData = data;
        buildCytoscape(data);
        renderNoteList(data.nodes);
        statsLabel.textContent = `${data.nodes.length} notes · ${data.edges.length} edges • Live`;
      })
      .catch(() => {
        statsLabel.textContent = 'Failed to load graph';
      });
  }
  loadGraph();

  // ── Cytoscape ────────────────────────────────────────────────────────────────
  function buildCytoscape(data) {
    const elements = [
      ...data.nodes.map(n => ({ data: { id: n.id, label: n.label } })),
      ...data.edges.map(e => ({
        data: {
          id: `${e.source}__${e.target}`,
          source: e.source,
          target: e.target,
          weight: e.weight
        }
      }))
    ];

    cy = cytoscape({
      container: document.getElementById('cy'),
      elements,
      style: [
        {
          selector: 'node',
          style: {
            'background-color': '#4c2d8a',
            'label': 'data(label)',
            'color': '#ddd',
            'font-size': '10px',
            'text-valign': 'bottom',
            'text-margin-y': '5px',
            'width':  'mapData(degree, 0, 12, 18, 48)',
            'height': 'mapData(degree, 0, 12, 18, 48)',
            'border-width': '1.5px',
            'border-color': '#7c3aed'
          }
        },
        {
          selector: 'node:selected',
          style: { 'background-color': '#a855f7', 'border-color': '#fff', 'border-width': '2px' }
        },
        {
          selector: 'node.highlighted',
          style: { 'background-color': '#7c9cff', 'border-color': '#7c9cff' }
        },
        {
          selector: 'node.faded',
          style: { 'opacity': 0.18 }
        },
        {
          selector: 'edge',
          style: {
            'width': 'mapData(weight, 1, 16, 1, 5)',
            'line-color': '#0f3460',
            'opacity': 0.75,
            'curve-style': 'bezier'
          }
        },
        {
          selector: 'edge.highlighted',
          style: { 'line-color': '#7c3aed', 'opacity': 1 }
        },
        {
          selector: 'edge.faded',
          style: { 'opacity': 0.05 }
        }
      ],
      layout: { name: 'cose', idealEdgeLength: 120, nodeOverlap: 20,
                refresh: 20, fit: true, padding: 40, animate: false,
                randomize: false, componentSpacing: 80 }
    });

    // Degree for node sizing
    cy.nodes().forEach(n => n.data('degree', n.degree()));
    cy.style().update();

    cy.on('tap', 'node', e => {
      highlightNeighbors(e.target);
      loadDetail(e.target.id());
    });

    cy.on('tap', e => {
      if (e.target === cy) {
        resetHighlight();
        closeDetail();
      }
    });
  }

  // ── Highlight ────────────────────────────────────────────────────────────────
  function highlightNeighbors(node) {
    cy.elements().removeClass('highlighted faded');
    const hood = node.neighborhood().add(node);
    cy.elements().not(hood).addClass('faded');
    hood.addClass('highlighted');
  }

  function resetHighlight() {
    cy.elements().removeClass('highlighted faded');
  }

  // ── Detail panel ─────────────────────────────────────────────────────────────
  function loadDetail(noteId) {
    activeNoteId = noteId;
    document.querySelectorAll('.note-item')
      .forEach(el => el.classList.toggle('active', el.dataset.id === noteId));

    fetch(`/api/notes/${encodeURIComponent(noteId)}`)
      .then(r => r.json())
      .then(renderDetail);
  }

  function renderDetail(note) {
    document.getElementById('detail-title').textContent = note.title;
    let html = '';

    if (note.tags && note.tags.length) {
      html += `<div class="section"><div class="section-label">Tags</div>`;
      html += note.tags.map(t => `<span class="pill">#${t}</span>`).join('');
      html += '</div>';
    }

    if (note.wikiLinks && note.wikiLinks.length) {
      html += `<div class="section"><div class="section-label">Links to</div>`;
      html += note.wikiLinks.map(l =>
        `<a class="link-row" onclick="jumpTo('${esc(l)}')">${l}</a>`).join('');
      html += '</div>';
    }

    if (note.backlinks && note.backlinks.length) {
      html += `<div class="section"><div class="section-label">Backlinks</div>`;
      html += note.backlinks.map(l =>
        `<a class="link-row" onclick="jumpTo('${esc(l)}')">${l}</a>`).join('');
      html += '</div>';
    }

    if (note.headings && note.headings.length) {
      html += `<div class="section"><div class="section-label">Headings</div>`;
      html += note.headings.map(h => `<div class="heading-row">${h}</div>`).join('');
      html += '</div>';
    }

    document.getElementById('detail-body').innerHTML = html;
    document.getElementById('detail').classList.add('open');
  }

  function closeDetail() {
    document.getElementById('detail').classList.remove('open');
    activeNoteId = null;
    document.querySelectorAll('.note-item').forEach(el => el.classList.remove('active'));
  }

  function jumpTo(noteId) {
    const node = cy.getElementById(noteId);
    if (node.length) {
      cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.4) }, { duration: 350 });
      highlightNeighbors(node);
    }
    loadDetail(noteId);
  }

  // ── Note list ────────────────────────────────────────────────────────────────
  function renderNoteList(nodes) {
    const sorted = [...nodes].sort((a, b) => a.label.localeCompare(b.label));
    document.getElementById('note-list').innerHTML = sorted
      .map(n => `<div class="note-item" data-id="${n.id}"
                   onclick="jumpTo('${esc(n.id)}')">${n.label}</div>`)
      .join('');
  }

  // ── Search ───────────────────────────────────────────────────────────────────
  let searchTimer;
  document.getElementById('search-input').addEventListener('input', e => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    if (!q) {
      if (graphData) renderNoteList(graphData.nodes);
      resetHighlight();
      return;
    }
    searchTimer = setTimeout(() => {
      fetch(`/api/search?q=${encodeURIComponent(q)}&limit=30`)
        .then(r => r.json())
        .then(ids => {
          if (!graphData) return;
          const matched = graphData.nodes.filter(n => ids.includes(n.id));
          renderNoteList(matched);
          cy.elements().removeClass('highlighted faded');
          if (ids.length) {
            const hits = cy.nodes().filter(n => ids.includes(n.id()));
            cy.nodes().not(hits).addClass('faded');
            hits.addClass('highlighted');
          }
        });
    }, 280);
  });

  // ── Layout cycling ───────────────────────────────────────────────────────────
  function nextLayout() {
    layoutIdx = (layoutIdx + 1) % layouts.length;
    cy.layout({ name: layouts[layoutIdx], fit: true, padding: 40 }).run();
  }

  // ── Real-time updates (SSE) ─────────────────────────────────────────────────
  const evtSource = new EventSource('/api/events');
  evtSource.addEventListener('graph-updated', () => {
    document.getElementById('stats-label').textContent = 'Updating…';
    loadGraph();
  });

  // ── Utility ──────────────────────────────────────────────────────────────────
  function esc(s) {
    return s.replace(/'/g, "\\'");
  }
</script>
</body>
</html>
