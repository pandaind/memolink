# ─────────────────────────────────────────────────────────────────────────────
# MemoLink MCP Server — Streamable HTTP profile  (Spring AI 2.0.0+ / Tomcat)
#
# Activate with:  --spring.profiles.active=http
# or env var:     SPRING_PROFILES_ACTIVE=http
#
# VS Code / Cursor mcp.json for this mode:
#   {
#     "memolink": {
#       "type": "http",
#       "url": "http://localhost:8765/mcp",
#       "headers": { "X-API-Key": "sk-vscode-changeme" }
#     }
#   }
#
# Claude Desktop mcp.json (read-only):
#   {
#     "memolink": {
#       "type": "http",
#       "url": "http://localhost:8765/mcp",
#       "headers": { "X-API-Key": "sk-claude-changeme" }
#     }
#   }
# ─────────────────────────────────────────────────────────────────────────────
spring:
  main:
    web-application-type: servlet   # switch ON the web server
    banner-mode: off

  # ── Virtual threads (Java 21+) ──────────────────────────────────────────────
  # Tomcat request handlers run on virtual threads — eliminates thread-pool
  # bottlenecks during blocking I/O (file writes, ONNX inference, Lucene search).
  threads:
    virtual:
      enabled: true

  ai:
    mcp:
      server:
        type: SYNC                  # SYNC suits Spring MVC / Tomcat
        protocol: STREAMABLE        # Streamable HTTP replaces legacy SSE transport

        # ── Streamable HTTP settings ─────────────────────────────────────────
        streamable-http:
          mcp-endpoint: /mcp        # single unified endpoint for all MCP traffic
          keep-alive-interval: 20s  # built-in ping every 20 s — prevents proxy timeouts

server:
  port: ${MEMOLINK_HTTP_PORT:8765}



# ── Authentication ────────────────────────────────────────────────────────────
memolink:
  auth:
    enabled: true
    clients:
      # READ+WRITE: VS Code / Cursor agents that can create and update notes
      - name: vscode
        key: ${MEMOLINK_KEY_VSCODE:sk-vscode-changeme}
        roles: [READ, WRITE]

      # READ only: Claude Desktop, read-only browsing agents
      - name: claude-desktop
        key: ${MEMOLINK_KEY_CLAUDE:sk-claude-changeme}
        roles: [READ]

      # READ only: CI / automation that should never mutate notes
      - name: ci-bot
        key: ${MEMOLINK_KEY_CI:sk-ci-changeme}
        roles: [READ]

logging:
  level:
    ist.logic: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"

# ── Spring Actuator (healthcheck for Docker) ──────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
