memolink:
  notes-dir: ${MEMOLINK_NOTES_DIR:${user.home}/notes}
  note:
    # Path to the Mustache template used when rendering notes to markdown.
    # Override with file:/path/to/your/note.mustache to customise without rebuilding.
    template: classpath:templates/note.mustache
    # Frontmatter fields added to every note header.
    # "created" / "date" are auto-filled with today's date if present.
    metadata-fields:
      - name: created
        description: "ISO date when the note was first created (auto-set)"
        required: false
      - name: source
        description: "Source URL or reference for the note content"
        required: false
  # ── Authentication (HTTP/SSE mode only) ──────────────────────────────────
  # auth.enabled is false by default (stdio mode — OS process trust model).
  # Enable via the 'http' Spring profile: --spring.profiles.active=http
  # See application-http.yml for full HTTP + auth configuration.
  auth:
    enabled: false

  # ── Headroom kompress compression sidecar ────────────────────────────────
  # Set HEADROOM_ENABLED=true and HEADROOM_URL=http://headroom:8787 (or any
  # reachable URL) to enable token compression of tool outputs.
  headroom:
    url:             ${HEADROOM_URL:}
    enabled:         ${HEADROOM_ENABLED:false}
    min-chars:       ${HEADROOM_MIN_CHARS:300}
    timeout-seconds: ${HEADROOM_TIMEOUT_SECONDS:30}

spring:
  application:
    name: memolink-mcp-server
  main:
    # MCP stdio server must not start a web server
    web-application-type: none
    # Banner and stdout logging must be off — MCP uses stdout for JSON-RPC
    banner-mode: off
    log-startup-info: false
  ai:
    mcp:
      server:
        enabled: true
        name: memolink-mcp-server
        version: 0.1.0
        # SYNC = stdio transport (for Claude Desktop, Cursor, etc.)
        # Change to ASYNC for SSE transport
        type: SYNC

logging:
  level:
    root: OFF
    ist.logic: OFF
