memolink:
  notes-dir: ${MEMOLINK_NOTES_DIR:${user.home}/notes}

spring:
  application:
    name: memolink-mcp-server
  main:
    # MCP stdio server must not start a web server
    web-application-type: none
  ai:
    mcp:
      server:
        enabled: true
        name: memolink-mcp-server
        version: 0.1.0
        # SYNC = stdio transport (for Claude Desktop, Cursor, etc.)
        # Change to ASYNC for SSE transport
        type: SYNC

logging:
  level:
    ist.logic: INFO
  # Suppress all console output on startup so stdio stays clean for MCP
  pattern:
    console: ""
