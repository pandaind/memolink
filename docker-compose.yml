# ─────────────────────────────────────────────────────────────────────────────
# MemoLink + Headroom — Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
#
# Architecture:
#
#   LLM Client (Claude Desktop / VS Code / Cursor)
#        │  Streamable HTTP  → localhost:8765
#        ▼
#   ┌─────────────────────────────┐
#   │  memolink-mcp-server :8765  │  Java · Spring Boot / Tomcat
#   │  ┌───────────────────────┐  │
#   │  │ Stage 1: BM25 + KNN  │  │  hybridSearch → top-N candidates
#   │  │ Stage 2: cross-encoder│  │  rerank → top-K (when enabled)
#   │  └───────────────────────┘  │
#   │  (HeadroomCompressionService│
#   │   compresses tool outputs)  │
#   └──────────────┬──────────────┘
#                  │  POST /compress → :8787  (internal Docker network)
#                  ▼
#   ┌─────────────────────────────┐
#   │  headroom sidecar    :8787  │  Python · FastAPI · kompress-small ONNX
#   └─────────────────────────────┘
#                  │
#           shared vault volume
#
# Profiles:
#   (default)      memolink only — stdio or HTTP, no compression, no reranker
#   compression    adds headroom sidecar
#   reranker       enables cross-encoder reranking inside the memolink JVM
#                  (no extra container — the model runs inside the Java process)
#
# Quick start:
#   cp .env.example .env   # edit VAULT_DIR and API keys
#   docker compose up --build
#
# With headroom + reranker:
#   docker compose --profile compression --profile reranker up --build
#
# LLM client config (VS Code mcp.json):
#   { "memolink": { "type": "http", "url": "http://localhost:8765/mcp",
#                   "headers": { "X-API-Key": "sk-vscode-changeme" } } }
# ─────────────────────────────────────────────────────────────────────────────


services:

  # ── headroom: kompress-small ONNX compression sidecar ─────────────────────
  headroom:
    image: logicist/memolink-headroom:latest
    build:
      context: docker/headroom
      # Change this build-arg to swap to kompress-base (higher quality, ~600 MB):
      #   KOMPRESS_MODEL_ID: chopratejas/kompress-base
      args:
        KOMPRESS_MODEL_ID: ${KOMPRESS_MODEL_ID:-chopratejas/kompress-small}
    environment:
      KOMPRESS_MODEL_ID:   ${KOMPRESS_MODEL_ID:-chopratejas/kompress-small}
      KOMPRESS_THRESHOLD:  ${KOMPRESS_THRESHOLD:-0.5}
      KOMPRESS_CHUNK_WORDS: ${KOMPRESS_CHUNK_WORDS:-350}
      HEADROOM_KOMPRESS_BACKEND: pytorch
      # Limit ONNX internal thread pools to avoid CPU contention in containers
      HEADROOM_KOMPRESS_ONNX_INTRA_THREADS: "2"
      HEADROOM_KOMPRESS_ONNX_INTER_THREADS: "1"
    ports:
      # Expose on host for debugging/testing — remove in production
      - "${HEADROOM_HOST_PORT:-8787}:8787"
    # healthcheck is defined in the Dockerfile; referenced here for depends_on
    restart: unless-stopped
    profiles:
      - compression

  # ── memolink-mcp-server: Java MCP server (HTTP/SSE mode) ──────────────────
  memolink:
    image: logicist/memolink:latest
    build:
      context: .                          # full repo root for the Maven reactor
      dockerfile: docker/memolink/Dockerfile
    environment:
      # Vault directory (bind-mounted from host)
      MEMOLINK_VAULT_DIR: /vault
      # Lucene storage mode: memory or disk
      MEMOLINK_LUCENE_STORAGE: ${LUCENE_STORAGE:-memory}
      # Spring profile — must be 'http' for Streamable HTTP transport
      SPRING_PROFILES_ACTIVE: http
      MEMOLINK_HTTP_PORT: "8765"

      # ── JVM memory tuning ─────────────────────────────────────────────────
      # -Xmx768m  : cap heap at 768 MB (leaves ~256 MB for off-heap: Lucene,
      #             ONNX Runtime native buffers, Netty direct memory, etc.)
      # G1GC      : low-pause collector; MaxGCPauseMillis keeps GC < 200 ms
      # +ExitOnOutOfMemoryError : crash fast & let Docker restart the container
      #             rather than limping with a broken JVM after an OOM
      JAVA_TOOL_OPTIONS: >-
        -Xmx768m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+ExitOnOutOfMemoryError

      # ── Headroom integration ──────────────────────────────────────────────
      # URL of the headroom sidecar on the internal Docker network
      HEADROOM_URL:       http://headroom:8787
      HEADROOM_ENABLED:   ${HEADROOM_ENABLED:-true}
      # Skip compression for content shorter than this many chars (fast-path)
      HEADROOM_MIN_CHARS: ${HEADROOM_MIN_CHARS:-300}

      # ── API keys (override in .env) ────────────────────────────────────────
      MEMOLINK_KEY_VSCODE: ${MEMOLINK_KEY_VSCODE:-sk-vscode-changeme}
      MEMOLINK_KEY_CLAUDE: ${MEMOLINK_KEY_CLAUDE:-sk-claude-changeme}
      MEMOLINK_KEY_CI:     ${MEMOLINK_KEY_CI:-sk-ci-changeme}

      # ── Cross-encoder reranker ────────────────────────────────────────────
      # Set MEMOLINK_RERANKER_ENABLED=true (or use --profile reranker) to
      # enable two-stage retrieval: BM25+KNN → cross-encoder rerank.
      # Adds ~100-300ms latency per search. No extra container needed —
      # the 87MB ONNX model runs inside the memolink JVM.
      MEMOLINK_RERANKER_ENABLED:            ${MEMOLINK_RERANKER_ENABLED:-false}
      MEMOLINK_RERANKER_CANDIDATE_MULTIPLE: ${MEMOLINK_RERANKER_CANDIDATE_MULTIPLE:-4}
      MEMOLINK_RERANKER_MAX_CANDIDATES:     ${MEMOLINK_RERANKER_MAX_CANDIDATES:-20}
    
    # Keep stdin open so the Spring AI STDIO transport doesn't detect EOF and shut down the JVM
    stdin_open: true
    tty: true
    ports:
      # LLM clients connect here
      - "${MEMOLINK_HOST_PORT:-8765}:8765"
    volumes:
      # Bind-mount your vault directory.  Set VAULT_DIR in .env or inline:
      #   VAULT_DIR=/Users/you/obsidian-vault docker compose up
      - ${VAULT_DIR:-./vault}:/vault:rw
      # Persist extracted ONNX model caches across container restarts
      # (avoids re-extracting 86MB bi-encoder + 87MB cross-encoder on every start)
      - memolink-models:/root/.memolink/models
    depends_on:
      headroom:
        condition: service_healthy     # wait until kompress model is fully loaded
        required: false                # allow starting without headroom
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # JVM heap (1g) + off-heap overhead:
          #   Lucene buffers, bi-encoder ONNX (~86MB native), cross-encoder (~87MB native)
          # Raise to 1.5g when reranker is enabled alongside headroom.
          memory: ${MEMOLINK_MEMORY_LIMIT:-1.2g}

volumes:
  memolink-models:   # named volume — ONNX models survive container restarts
